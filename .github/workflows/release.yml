name: Release & Package

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release Version Tag (e.g. v2.4.0)"
        required: false
        default: "v2.4.0"

jobs:
  build-and-release:
    name: Build Distribution & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine wheel

      - name: Build Source Distribution and Wheel
        run: |
          python -m build
          ls -la dist/

      - name: Generate SHA-256 Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Validate distribution packages
        run: |
          twine check dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*
            examples/quantum-computing-brief/research_report.md
            examples/quantum-computing-brief/report.html
            examples/market-intelligence-report/ai_agents_market_2026.md
          generate_release_notes: true
          draft: false
          prerelease: false
